services:
  - type: web
    name: dairy-ai
    runtime: docker
    dockerfilePath: docker/Dockerfile
    startCommand: bash scripts/startup.sh
    healthCheckPath: /api/v1/health
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"